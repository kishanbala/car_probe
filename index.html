<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f5f7">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>Car shortlist</title>
<style>:root{--bg:#f4f5f7;--card:#fff;--tx:#14161a;--mut:#667085;--bd:#e4e7ec;--g:#1f9d55;--a:#d9822b;--r:#d64545;--n:#8a8f98;--ac:#2f5bea}
@media(prefers-color-scheme:dark){:root{--bg:#0d0e11;--card:#16181c;--tx:#f2f3f5;--mut:#9aa1ad;--bd:#262a31;--ac:#6f8cff}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 -apple-system,system-ui,Segoe UI,Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) 16px 110px}
h1{font-size:22px;margin:4px 0 14px;font-weight:650}
h2{font-size:13px;margin:22px 0 8px;font-weight:600;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px}
.row{display:flex;align-items:center;gap:10px}.sp{justify-content:space-between}
.mut{color:var(--mut)}small{font-size:13px;color:var(--mut)}
textarea{width:100%;min-height:150px;border:1px solid var(--bd);border-radius:14px;padding:12px;font:15px/1.4 ui-monospace,Menlo,monospace;background:var(--card);color:var(--tx);resize:vertical}
input[type=number]{width:100%;border:1px solid var(--bd);border-radius:10px;padding:10px;font:16px inherit;background:var(--card);color:var(--tx)}
button{font:inherit;border:0;border-radius:14px;padding:14px 16px;min-height:48px;background:var(--card);color:var(--tx);border:1px solid var(--bd);cursor:pointer}
button.pri{background:var(--ac);color:#fff;border-color:var(--ac);font-weight:600}
button.danger{color:var(--r)}
button.sm{min-height:36px;padding:6px 12px;border-radius:10px;font-size:14px}
.full{width:100%}.mt{margin-top:10px}
.hero{border-radius:20px;padding:18px;color:#fff;display:flex;align-items:center;gap:16px}
.hero.Strong{background:var(--g)}.hero.Maybe{background:var(--a)}.hero.Skip{background:var(--r)}.hero.Filtered{background:#5b6270}.hero.Not{background:#6b7280}
.hero .b{font-size:26px;font-weight:700;line-height:1.1}.hero small{color:rgba(255,255,255,.85)}
.ring{flex:none}.ring text{fill:#fff;font:700 22px -apple-system,system-ui,sans-serif}
.sum{margin:12px 0 2px;font-weight:600}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chip{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px 12px}
.chip .ch{display:flex;justify-content:space-between;font-size:14px}
.bar{height:6px;background:var(--bd);border-radius:6px;margin:7px 0 6px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px}
.green{background:var(--g)}.amber{background:var(--a)}.red{background:var(--r)}.grey{background:var(--n)}
.flag{display:flex;gap:8px;padding:6px 0}.flag:before{content:"!";flex:none;width:20px;height:20px;border-radius:10px;background:var(--a);color:#fff;font:700 13px/20px sans-serif;text-align:center}
.bad{border-color:var(--r);color:var(--r)}
.seg{display:flex;gap:6px;margin-top:10px}.seg button{flex:1;min-height:38px;padding:6px;font-size:14px}.seg button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.big{font-size:28px;font-weight:700}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding:6px 8px max(8px,env(safe-area-inset-bottom));gap:6px}
.tabs button{flex:1;border:0;background:none;border-radius:12px;color:var(--mut);font-size:15px}
.tabs button.on{color:var(--ac);font-weight:650}
.li{display:flex;align-items:center;gap:12px;padding:12px;border-bottom:1px solid var(--bd);cursor:pointer}
.li:last-child{border-bottom:0}.dot{flex:none;width:12px;height:12px;border-radius:6px}
.li .t{font-weight:600}.li .sc{margin-left:auto;font-weight:700}
table{border-collapse:collapse;width:100%;font-size:14px}th,td{padding:8px 6px;text-align:left;border-bottom:1px solid var(--bd);white-space:nowrap}th{color:var(--mut);font-weight:600;cursor:pointer}
.scroll{overflow-x:auto;margin:0 -16px;padding:0 16px}
.meter{height:8px;background:var(--bd);border-radius:8px;overflow:hidden}.meter i{display:block;height:100%;background:var(--ac)}
label.f{display:block;font-size:14px;color:var(--mut);margin:10px 0 4px}
.chk{display:flex;flex-wrap:wrap;gap:8px}.chk label{display:flex;align-items:center;gap:6px;border:1px solid var(--bd);border-radius:10px;padding:8px 10px;font-size:14px}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;text-align:center}
.toast.on{opacity:1}
.back{background:none;border:0;padding:8px 0;min-height:0;color:var(--ac);font-weight:600}
.ok{color:var(--g)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{min-height:38px;padding:6px 14px;border-radius:999px;font-size:15px}
.chips button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
input[type=range]{width:100%;margin:6px 0 2px;accent-color:var(--ac);height:32px}
.lb{display:flex;justify-content:space-between;font-size:14px;color:var(--mut);margin:16px 0 4px}.lb:first-child{margin-top:0}.lb b{color:var(--tx);font-weight:600}
.link{background:none;border:0;min-height:0;padding:4px 0 4px 12px;color:var(--ac);font-weight:600}
.filebtn{flex:1;display:block;text-align:center;border:1px solid var(--bd);border-radius:10px;padding:7px;font-size:14px;background:var(--card)}
</style></head>
<body><main id="app"></main><nav class="tabs" id="tabs"></nav><div class="toast" id="toast"></div>
<script>(()=>{const full = (rx) => new RegExp('^(?:' + rx.source + ')$', rx.flags);
const clip = (x, a = 0, b = 100) => Math.max(a, Math.min(b, x));
const r1 = (x) => Math.round(x * 10) / 10;

function linesOf(text) {
  return String(text).replace(/\xa0/g, ' ').replace(/&amp;/g, '&')
    .split(/\r\n|[\n\r\v\f\u0085\u2028\u2029]/).map((l) => l.trim()).filter(Boolean);
}
function num(s) {
  const d = String(s ?? '').replace(/\D/g, '');
  return d ? parseInt(d, 10) : null;
}
function after(lines, labels) {
  const pat = new RegExp('^(?:' + labels.join('|') + ')\\d?$', 'i');
  for (let i = 0; i < lines.length; i++) if (pat.test(lines[i]) && i + 1 < lines.length) return lines[i + 1];
  return null;
}
function section(lines, start, ends) {
  const s = new RegExp('^(?:' + start + ')$', 'i'), e = new RegExp('^(?:' + ends + ')$', 'i');
  for (let i = 0; i < lines.length; i++) {
    if (s.test(lines[i])) {
      for (let j = i + 1; j < lines.length; j++) if (e.test(lines[j])) return lines.slice(i + 1, j);
      return lines.slice(i + 1);
    }
  }
  return [];
}
const FUEL = [
  [/plug-in-hybrid\s*benzin|plug-in hybrid petrol/, 'phev_petrol'],
  [/plug-in-hybrid\s*diesel/, 'phev_diesel'],
  [/benzin|petrol|gasoline/, 'petrol'],
  [/diesel/, 'diesel'],
  [/elektro|electric/, 'ev'],
  [/hybrid/, 'hybrid'],
].map(([rx, f]) => [new RegExp('^(?:' + rx.source + ')(?:,.*)?$'), f]);
function fuelOfLine(l) {
  const ll = l.toLowerCase().trim();
  if (ll.length > 40) return null;
  for (const [rx, f] of FUEL) if (rx.test(ll)) return f;
  return null;
}

const STOP = full(/Other vehicles from this dealer|Weitere Fahrzeuge dieses Händlers|Alternative Modelle|Mehr Details|Sicher kaufen:.*/i);
const NOISE = full(/Language|Sprache|Appearance|Darstellung|Dark Mode|Light Mode|System Mode|Deutsch|English|Español|Français|Nederlands|Polski|Română|Русский|Čeština|Türk\w*|Svenska|Magyar|Українська|Български|Česky|Hrvatski|Italia|Luxembourg|Österreich|España|France|Deutschland|België\/Belgique|Install the app|App installieren|Imprint|Impressum|Privacy Policy|Datenschutz|Privacy Settings|Contact|Kontakt|Ad|Anzeige|Beta|NEW|NEU|Use the left and right arrow keys.*|Start car panorama|Zurück nach oben|Nach Oben|Zum Anfang|Merken|Vergleichen|Teilen/);
const BLOB = /Studio-Fotos|Widerrufsrecht|Haftung|Passenger Car Energy|Energieverbrauchskennzeichnung|Leasingbeispiel|Irrtum und Zwischenverkauf|CO₂ ist das/i;
function clean(text) {
  const out = [];
  for (const l of linesOf(text)) {
    if (STOP.test(l)) break;
    if (NOISE.test(l)) continue;
    if (l.length > 250 && BLOB.test(l)) continue;
    out.push(l);
  }
  return out;
}

const PROGRAMMES = [
  { name: 'Junge Sterne', rx: /Junge Sterne/i, months: 24 },
  { name: 'Audi Gebrauchtwagen :plus', rx: /Gebrauchtwagen\s?:\s?plus/i, months: null },
  { name: 'Das WeltAuto', rx: /Das WeltAuto/i, months: null },
  { name: 'BMW Premium Selection', rx: /Premium Selection/i, months: null },
];
const FRANCHISE_RX = /autorisierte[nr]?\s+[\w-]+\s+Partner|teilnehmenden Audi Partnern|Audi Partner|Mercedes-Benz Partner|Junge Sterne|Premium Selection|Gebrauchtwagen\s?:\s?plus|Das WeltAuto/i;
const detectProgramme = (t) => PROGRAMMES.find((p) => p.rx.test(t)) || null;
const detectSeal = (t) => (/Dekra Siegel/i.test(t) ? 'DEKRA Siegel' : null);

const KM_RX = /^(\d{1,3}(?:[.,]\d{3})+|\d+)\s*km$/i;
const DATE_RX = /^(?:(\d{2})\.(\d{2})\.(\d{4})|(\d{2})\/(\d{4}))$/;
const PWR_RX = /(\d{2,3})\s*kW\s*\(\s*(\d{2,3})\s*(?:PS|hp)\s*\)/i;
const PRICE_A = /^€\s?(\d{1,3}(?:[.,]\d{3})+)\d?(?!\d)/;
const PRICE_B = /^(\d{1,3}(?:[.,]\d{3})+)\s?€/;
const SKIP_P = /mtl|monat|rate|netto|net,|exkl|^ab |from|finanz|upe|anzahl|leasing/i;
const PL = /(Sehr guter Preis|Very good price|Guter Preis|Good price|Fairer Preis|Fair price|Erhöhter Preis|Elevated price|Hoher Preis|High price)/i;
const PL_FULL = full(PL);
const BAND = /€\s*([\d.]+)\s*-\s*€\s*([\d.]+)/;
const RATING = /(\d[.,]\d)\s*(?:stars|Sterne|von 5|of 5)/i;
const ORG = /GmbH|KG\b|Autohaus|\bAG\b|OHG|e\.K\./i;
const FLAG_RX = {
  navigation: /Navigationssystem/i,
  acc: /Abstandstempomat|DISTRONIC|adaptive cruise/i,
  comfort_seats: /Komfortsitze|Komfort-Paket Sitze|Lendenwirbelstütze|Lordosenstütze/i,
  seat_heating: /Sitzheizung/i,
  rear_camera: /Rückfahrkamera|Surround View/i,
  led: /LED-Scheinwerfer|LED Scheinwerfer|Scheinwerfer LED/i,
  tow_bar: /Anhängerkupplung/i,
  adaptive_susp: /AIRMATIC|Luftfederung|Dämpferregelung|adaptive (?:chassis|Fahrwerk|damping)/i,
};
const fl = (s) => parseFloat(s.replace(',', '.'));

function priceOf(ls) {
  for (const l of ls) {
    if (l.length > 30 || SKIP_P.test(l)) continue;
    const m = PRICE_A.exec(l) || PRICE_B.exec(l);
    if (m) {
      const v = num(m[1]);
      if (v && v >= 2000 && v <= 300000) return v;
    }
  }
  return null;
}
function firstReg(ls) {
  const v = after(ls, ['First Registration', 'Erstzulassung']);
  for (const c of (v ? [v] : []).concat(ls)) {
    const m = DATE_RX.exec(c);
    if (m) return m[1] ? [+m[3], +m[2]] : [+m[5], +m[4]];
  }
  return [null, null];
}
function claim(ls, feat, desc, labels, textRx) {
  const v = after(ls, labels);
  if (v && /^(?:ja|yes)$/i.test(v)) return { tier: 1, evidence: 'structured field' };
  if (feat.some((f) => textRx.test(f))) return { tier: 2, evidence: 'dealer feature list' };
  if (desc.some((d) => textRx.test(d))) return { tier: 3, evidence: 'dealer description' };
  return null;
}
function warrantyOf(ls, txt, feat, desc) {
  const prog = detectProgramme(txt), seal = detectSeal(txt);
  let months = null, tier = null, ev = null;
  const v = after(ls, ['Garantie', 'Warranty']);
  if (v) {
    const m = /(\d+)\s*(?:Monate|months)/i.exec(v);
    if (m) { months = +m[1]; tier = 1; ev = 'structured: ' + v; }
  }
  if (prog) { tier = 1; ev = ev || 'programme: ' + prog.name; months = months || prog.months; }
  if (tier === null) {
    if (feat.some((f) => /Garantie|Warranty/i.test(f))) { tier = 2; ev = 'feature list mentions warranty'; }
    else if (desc.some((d) => /Garantie|warranty/i.test(d))) { tier = 3; ev = 'description mentions Garantie'; }
  }
  return { programme: prog ? prog.name : null, months, tier, evidence: ev,
    terms_vary: /unterschiedliche Garantiebedingungen|conditions vary/i.test(txt), seal };
}
function dealerOf(ls, txt) {
  const d = { name: after(ls, ['Ein Fahrzeug von:', 'Anbieter des Fahrzeugs']), rating: null, reviews: null, recommend: null, described: null };
  let m = RATING.exec(txt);
  if (m) {
    d.rating = fl(m[1]);
    if (!d.name) {
      for (let i = 0; i < ls.length; i++) {
        if (RATING.test(ls[i])) { if (i && ORG.test(ls[i - 1])) d.name = ls[i - 1]; break; }
      }
    }
  }
  m = /(\d[\d.,]*)\s*(?:Ratings|Bewertungen)/i.exec(txt);
  d.reviews = m ? num(m[1]) : null;
  m = /(?:Recommendations|Referrals|Weiterempfehlungen)\s*(\d{2,3})\s*%/i.exec(txt) || /(\d{2,3})\s*%\s*(?:Recommendations|Weiterempfehlungen)/i.exec(txt);
  d.recommend = m ? +m[1] : null;
  m = /(?:Vehicle as described|Fahrzeug wie beschrieben)\s*(\d{2,3})\s*%/i.exec(txt) || /(\d{2,3})\s*%\s*(?:Vehicle as described|Fahrzeug wie beschrieben)/i.exec(txt);
  d.described = m ? +m[1] : null;
  return d;
}
function ymdOf(today) {
  if (typeof today === 'string') return today.split('-').map(Number);
  const d = today || new Date();
  return [d.getFullYear(), d.getMonth() + 1, d.getDate()];
}

function extract(raw, today) {
  const ls = clean(raw), txt = ls.join('\n'), L = {};
  L.page_type = ((raw.match(/^Fahrzeug anzeigen$/gm) || []).length >= 3 || /Ihr Suchergebnis\s*-\s*\d+/.test(raw)) ? 'results' : null;
  L.price = priceOf(ls);
  const kv = after(ls, ['Mileage', 'Kilometerstand', 'Laufleistung', 'Kilometer']);
  let km = kv ? KM_RX.exec(kv) : null;
  if (!km) km = ls.map((l) => KM_RX.exec(l)).find(Boolean) || null;
  L.km = km ? num(km[1]) : null;
  [L.first_reg_year, L.first_reg_month] = firstReg(ls);
  let m = PWR_RX.exec(txt);
  [L.kw, L.ps] = m ? [+m[1], +m[2]] : [null, null];
  L.fuel = ls.map(fuelOfLine).find(Boolean) || null;
  L.transmission = null;
  for (const l of ls) {
    if (/^(?:automatik(?:getriebe)?|automatic)$/i.test(l)) { L.transmission = 'automatic'; break; }
    if (/^(?:schaltgetriebe|manual|manuell|handschaltung)$/i.test(l)) { L.transmission = 'manual'; break; }
  }
  const feat = section(ls, 'Features|Ausstattung', 'Show less|Weniger anzeigen');
  const desc = section(ls, 'Vehicle description according to seller|Fahrzeugbeschreibung', 'Show less|Weniger anzeigen|Preisbewertung|Finanzierung|Price');
  let v = after(ls, ['Previous owners', 'Fahrzeughalter', 'Number of Vehicle Owners', 'Anzahl der Fahrzeughalter', 'Vorbesitzer']);
  [L.owners, L.owners_tier] = v && /^\d+$/.test(v) ? [+v, 1] : [null, null];
  if (L.owners === null) {
    m = /(\d)\.?\s*Hand\b|Erstbesitz|first owner/i.exec(desc.join('\n'));
    if (m) [L.owners, L.owners_tier] = [m[1] ? +m[1] : 1, 3];
  }
  v = after(ls, ['HU']);
  L.hu = v ? ({ neu: 'new', new: 'new' }[v.toLowerCase()] || v) : null;
  const low = txt.toLowerCase(), sv = after(ls, ['Verkäufer', 'Seller']);
  if (sv && /^(?:privat(?:e)?|private seller|privatverkäufer)$/i.test(sv)) L.seller = 'private';
  else if ((sv && /^(?:händler|dealer)$/i.test(sv)) || /about this dealer|über diesen händler|dealer rating|anbieter des fahrzeugs|ihr mercedes-benz händler|ein fahrzeug von/.test(low)) L.seller = 'dealer';
  else if (/private seller|privatverkäufer|von privat/.test(low)) L.seller = 'private';
  else L.seller = null;
  L.franchise = FRANCHISE_RX.test(txt) ? true : null;
  L.dealer = dealerOf(ls, txt);
  L.warranty = warrantyOf(ls, txt, feat, desc);
  L.claims = {
    scheckheft: claim(ls, feat, desc, ['Scheckheftgepflegt', 'Service history'], /Scheckheft|Service History/i),
    accident_free: claim(ls, feat, desc, ['Unfallfrei'], /unfallfrei|accident[- ]free/i),
  };
  m = /(\d{3})\/(\d{2})\s*R\s*(\d{2})/.exec(txt);
  if (m) L.tyre = { width: +m[1], profile: +m[2], inch: +m[3] };
  else {
    m = /(?:Alufelgen|Leichtmetallfelgen)\s*\((\d{2})"\)|(\d{2})\s*Zoll/.exec(txt);
    L.tyre = m ? { width: null, profile: null, inch: +(m[1] || m[2]) } : null;
  }
  m = /^(\d[.,]\d)\s*l\/100\s*km/m.exec(txt);
  L.consumption = m ? fl(m[1]) : null;
  m = /(?:Vehicle tax|Kraftfahrzeugsteuer)\s*\n?\s*€?\s?(\d{2,4})/i.exec(txt);
  L.tax_year = m ? +m[1] : null;
  m = /€\s?(\d[.,]\d{2})\s*\/\s*l/.exec(txt);
  L.fuel_price = m ? fl(m[1]) : null;
  m = PL.exec(txt);
  L.price_label = m ? m[1].toLowerCase() : null;
  L.price_bands = {};
  for (let i = 0; i < ls.length - 1; i++) {
    if (PL_FULL.test(ls[i])) {
      const b = BAND.exec(ls[i + 1]);
      if (b) L.price_bands[ls[i].toLowerCase()] = [num(b[1]), num(b[2])];
    }
  }
  m = /Letzte[r]?\s+(?:Inspektion\s+)?bei\s+([\d.]+)\s*km/i.exec(txt);
  L.last_service_km = m ? num(m[1]) : null;
  L.flags = Object.fromEntries(Object.entries(FLAG_RX).map(([k, rx]) => [k, rx.test(txt)]));
  if (L.page_type === null) L.page_type = (L.price && L.km && L.first_reg_year) ? 'listing' : 'unknown';
  if (L.first_reg_year) {
    const [y, mo, d] = ymdOf(today);
    const age = (Date.UTC(y, mo - 1, d) - Date.UTC(L.first_reg_year, (L.first_reg_month || 6) - 1, 1)) / 86400000 / 365.25;
    L.age_years = Math.round(age * 100) / 100;
    L.km_per_year = L.km ? Math.round(L.km / Math.max(age, 0.5)) : null;
  } else L.age_years = L.km_per_year = null;
  L.missing = ['price', 'km', 'first_reg_year', 'fuel', 'transmission', 'owners', 'hu', 'seller'].filter((k) => L[k] === null);
  return L;
}

function parseCards(raw) {
  const ls = linesOf(raw), cards = [];
  ls.forEach((a, i) => {
    if (!a.startsWith('Preis inkl. MwSt.')) return;
    let end = ls.findIndex((x, j) => j > i && x === 'Merken');
    if (end < 0) end = ls.length;
    const blk = ls.slice(i + 1, end);
    const c = { brand: i >= 2 ? ls[i - 2] : null, model: i >= 1 ? ls[i - 1] : null, vat_deductible: !a.includes('nicht ausweisbar'),
      price: null, first_reg_year: null, km: null, fuel: null, ps: null, dealer: null, zip: null, programme: null, seller: 'dealer' };
    blk.forEach((l, k) => {
      const m = PRICE_B.exec(l);
      if (m && c.price === null && blk[k - 1] !== 'Rate') c.price = num(m[1]);
      const d = DATE_RX.exec(l);
      if (d && c.first_reg_year === null) c.first_reg_year = +(d[3] || d[5]);
      const p = PWR_RX.exec(l);
      if (p && c.ps === null) c.ps = +p[2];
      const kk = KM_RX.exec(l);
      if (kk && c.km === null) c.km = num(kk[1]);
      const f = fuelOfLine(l);
      if (f && c.fuel === null) c.fuel = f;
      if (/^\d{5}\s+\S/.test(l) && c.zip === null) { c.zip = l; c.dealer = blk[k - 1] ?? null; }
      if (c.programme === null) { const pr = detectProgramme(l); c.programme = pr ? pr.name : null; }
    });
    cards.push(c);
  });
  return cards;
}

const DEFAULT_PROFILE = {
  name: 'default',
  filters: { max_price: 30000, fuel_in: ['petrol'], seller_in: ['dealer'], max_owners: 2, min_year: 2021, max_km: 80000 },

  <small>${esc(L.dealer.name || 'Dealer unknown')}${L.warranty.programme ? ' · ' + esc(L.warranty.programme) : ''}</small>
  ${V.reject.length ? `<div class="card mt bad">${V.reject.map(esc).join('<br>')}</div>` : ''}
  <h2>Criteria</h2><div class="grid">${chips}</div>
  ${V.flags.length ? `<h2>Watch out</h2><div class="card">${V.flags.map((f) => `<div class="flag">${esc(f)}</div>`).join('')}</div>` : ''}
  <h2>Running cost</h2><div class="card">${cost}<div class="seg">${[8000, 10000, 15000, 20000].map((k) => `<button class="${k === km ? 'on' : ''}" data-act="km" data-v="${k}">${k / 1000}k</button>`).join('')}</div></div>
  <h2>Ask the dealer</h2><div class="card"><ol style="margin:0;padding-left:20px">${qs}</ol><button class="sm mt" data-act="copyq">Copy questions</button></div>
  <div class="row mt" style="margin-top:18px">${id ? `<button class="pri" data-act="another" style="flex:2">Check another</button><button class="danger" data-act="del" data-id="${esc(id)}" style="flex:1">Remove</button>` : `<button class="pri full" data-act="save">Save and check another</button>`}</div>`;
}
function viewResults() {
  const cards = S.cur.cards, p = profile();
  const rows = cards.map((c) => ({ c, f: applyFilters(c, p) })), pass = rows.filter((r) => !r.f.reject.length).length;
  return `<button class="back" data-act="back">‹ Back</button><h1>Results page</h1>
  <div class="card"><b>${cards.length} cars</b> found, <b class="${pass ? 'ok' : ''}">${pass} pass</b> your requirements.<br><small>Open a passing car's own page and capture it for the full verdict.</small></div>
  <h2>Cars</h2><div class="card" style="padding:0">${rows.map(({ c, f }) => `<div class="li" style="cursor:default"><span class="dot ${f.reject.length ? 'red' : 'green'}"></span><div><div class="t">${esc(c.brand)} ${esc(c.model)}</div><small>${esc([c.price && '€' + fmt(c.price), c.km != null && fmt(c.km) + ' km', c.first_reg_year, c.ps && c.ps + ' PS', cap(c.fuel)].filter(Boolean).join(' · '))}</small>${f.reject.length ? `<br><small style="color:var(--r)">${esc(f.reject[0])}</small>` : ''}</div></div>`).join('')}</div>`;
}
function ranked() {
  const p = profile();
  return store.listings().map((r) => ({ r, V: evaluate(r.L, p) })).sort((a, b) => (b.V.band === 'Filtered out' ? -1 : 0) - (a.V.band === 'Filtered out' ? -1 : 0) || (b.V.score ?? -1) - (a.V.score ?? -1));
}
function viewSaved() {
  if (S.screen === 'compare') return viewCompare();
  const rk = ranked();
  if (!rk.length) return `<h1>Saved</h1><div class="card mut">Nothing saved yet. Check a listing and tap Save.</div>`;
  return `<div class="row sp"><h1>Saved</h1><button class="sm" data-act="compare">Compare</button></div><div class="card" style="padding:0">${rk.map(({ r, V }) => `<div class="li" data-act="open" data-id="${esc(r.id)}"><span class="dot ${bandColor(V.band)}"></span><div><div class="t">${esc(sumLine(r.L).split(' · ').slice(0, 3).join(' · '))}</div><small>${esc(r.L.dealer.name || '')} · ${esc(V.band)}</small></div><span class="sc">${V.score ?? '–'}</span></div>`).join('')}</div>`;
}
function viewCompare() {
  const [key, dir] = S.sort, p = profile();
  const rows = store.listings().map((r) => { const V = evaluate(r.L, p), L = r.L, ch = Object.fromEntries(V.chips.map((c) => [c.key, c.score]));
    return { id: r.id, band: V.band, score: V.score, price: L.price, km: L.km, year: L.first_reg_year, ps: L.ps, cost: V.cost.fixed_plus_fuel_month, comfort: ch.comfort, warranty: ch.warranty }; });
  const val = (r) => (key === 'score' && r.band === 'Filtered out' ? -1 : r[key] ?? (dir > 0 ? 1e12 : -1));
  rows.sort((a, b) => (val(a) - val(b)) * dir);
  const th = (k, t) => `<th data-act="sort" data-k="${k}">${t}${key === k ? (dir > 0 ? ' ▲' : ' ▼') : ''}</th>`;
  return `<div class="row sp"><h1>Compare</h1><button class="sm" data-act="list">List</button></div><div class="scroll"><table><tr>${th('score', 'Score')}<th>Band</th>${th('price', 'Price')}${th('km', 'km')}${th('year', 'Year')}${th('ps', 'PS')}${th('cost', '€/mo')}${th('comfort', 'Comfort')}${th('warranty', 'Warranty')}</tr>
  ${rows.map((r) => `<tr data-act="open" data-id="${esc(r.id)}"><td><b>${r.score ?? '–'}</b></td><td><span class="dot ${bandColor(r.band)}" style="display:inline-block;vertical-align:middle;margin-right:6px"></span>${esc(r.band)}</td><td>${r.price ? '€' + fmt(r.price) : '–'}</td><td>${r.km != null ? fmt(r.km) : '–'}</td><td>${r.year ?? '–'}</td><td>${r.ps ?? '–'}</td><td>${r.cost ?? '–'}</td><td>${r.comfort ?? '–'}</td><td>${r.warranty ?? '–'}</td></tr>`).join('')}</table></div>`;
}
function render() {
  let h;
  if (S.tab === 'check') {
    if (!configured() && S.screen !== 'req') openReq();
    h = S.screen === 'req' ? viewReq() : S.screen === 'verdict' ? viewVerdict(S.cur.L, S.cur.id) : S.screen === 'results' ? viewResults() : viewPaste();
  } else h = S.screen === 'verdict' ? viewVerdict(S.cur.L, S.cur.id) : viewSaved();
  $('#app').innerHTML = h;
  const n = store.listings().length;
  $('#tabs').innerHTML = [['check', 'Check'], ['saved', 'Saved' + (n ? ' (' + n + ')' : '')]].map(([k, t]) => `<button class="${S.tab === k ? 'on' : ''}" data-act="tab" data-v="${k}">${t}</button>`).join('');
}
function download(name, text) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type: 'application/json' })); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
const toggle = (arr, v) => (arr.includes(v) ? arr.filter((x) => x !== v) : arr.concat(v));
const ACT = {
  tab(el) { S.tab = el.dataset.v; S.screen = null; S.msg = ''; render(); scrollTo(0, 0); },
  paste: pasteClip,
  analyse() { analyse($('#ta').value); },
  back() { S.screen = null; S.msg = ''; render(); },
  edit() { openReq(); render(); },
  cancelreq() { S.screen = null; render(); },
  fuel(el) { S.draft.filters.fuel_in = toggle(S.draft.filters.fuel_in, el.dataset.v); render(); },
  seller(el) { S.draft.filters.seller_in = toggle(S.draft.filters.seller_in, el.dataset.v); render(); },
  own(el) { S.draft.filters.max_owners = el.dataset.v === '' ? null : +el.dataset.v; render(); },
  kmy(el) { S.draft.assumptions.km_per_year = +el.dataset.v; render(); },
  resetf() { S.draft.filters = cp(DEFAULT_PROFILE.filters); S.draft.assumptions = cp(DEFAULT_PROFILE.assumptions); render(); },
  cont() {
    if (store.setProfile(S.draft) && store.setUI({ configured: true })) { S.screen = null; toast('Requirements saved'); render(); scrollTo(0, 0); }
    else toast('Storage full or blocked');
  },
  km(el) { S.kmYear = +el.dataset.v; render(); },
  save() { const id = store.add(S.cur.L); if (id) { toast('Saved'); S.screen = null; S.tab = 'check'; render(); scrollTo(0, 0); } else toast('Storage full: export a backup and remove old ones'); },
  another() { S.tab = 'check'; S.screen = null; render(); scrollTo(0, 0); },
  del(el) { store.remove(el.dataset.id); S.screen = null; toast('Removed'); render(); },
  open(el) { const r = store.find(el.dataset.id); if (r) { S.tab = 'saved'; S.screen = 'verdict'; S.cur = { L: r.L, id: r.id }; S.kmYear = null; render(); scrollTo(0, 0); } },
  compare() { S.screen = 'compare'; render(); },
  list() { S.screen = null; render(); },
  sort(el) { const k = el.dataset.k; S.sort = [k, S.sort[0] === k ? -S.sort[1] : (k === 'price' || k === 'km' || k === 'cost' ? 1 : -1)]; render(); },
  copyq() {
    const t = evaluate(S.cur.L, profile()).questions.map((q, i) => `${i + 1}. ${q}`).join('\n');
    (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => toast('Copied'), () => toast('Copy not allowed here'));
  },
  export() { const t = store.exportJSON(); download('car-shortlist-backup.json', t); (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => toast('Downloaded and copied'), () => toast('Downloaded')); },
  wipe() { if (confirm('Delete all saved listings and settings from this browser?')) { store.reset(); S.screen = null; S.tab = 'check'; render(); toast('Deleted'); } },
};
document.addEventListener('click', (e) => { const el = e.target.closest('[data-act]'); if (el && ACT[el.dataset.act]) ACT[el.dataset.act](el); });
document.addEventListener('input', (e) => {
  const k = e.target.dataset && e.target.dataset.k;
  if (!k || e.target.type !== 'range' || !S.draft) return;
  S.draft.filters[k] = +e.target.value; $('#o_' + k).textContent = RLABEL[k](+e.target.value);
});
document.addEventListener('paste', (e) => {
  if (e.target.id !== 'ta') return;
  setTimeout(() => { const v = $('#ta').value.trim(); if (v.length > 300 || /^https?:\/\/\S+$/.test(v)) analyse(v); }, 0);
});
document.addEventListener('change', async (e) => {
  if (e.target.id !== 'rf' || !e.target.files[0]) return;
  const r = store.importJSON(await e.target.files[0].text());
  toast(r.ok ? `Restored ${r.count} listings` : r.error); S.screen = null; render();
});
const hash = decodeURIComponent((location.hash || '').slice(1));
if (hash.length > 50) { history.replaceState(null, '', location.pathname + location.search); analyse(hash); } else render();
})();</script></body></html>
